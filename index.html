```html
<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VietVerse</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Be Vietnam Pro",sans-serif;
background:url("Background web@4x.png") center/cover fixed;
color:#3a240f;
overflow-x:hidden;
}

/* sections */

section{
min-height:100vh;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:60px 20px;
}

section.active{
display:flex;
}

/* titles */

h1,h2{
font-family:"Playfair Display",serif;
color:#7a3f18;
margin-bottom:20px;
}

h1{
font-size:60px;
}

p{
max-width:700px;
line-height:1.6;
font-size:18px;
}

/* buttons */

button{
padding:12px 24px;
background:#8b5a2b;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin:10px;
}

button:hover{
background:#6f431d;
}

/* cards */

.menu{
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
}

.card{
width:240px;
padding:25px;
background:rgba(255,255,255,0.9);
border-radius:12px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
cursor:pointer;
}

.card:hover{
transform:scale(1.05);
}

/* QUIZ */

.quiz button{
display:block;
margin:10px auto;
}

/* ===== NEW DOOR ===== */

#door{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
z-index:9999;
cursor:pointer;
}

.panel{
width:50%;
height:100%;
background:#3b1e0f;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:28px;
font-family:"Playfair Display";
transition:transform 1.5s ease;
}

#door.open .left{
transform:translateX(-100%);
}

#door.open .right{
transform:translateX(100%);
}

.hint{
position:absolute;
bottom:60px;
width:100%;
text-align:center;
color:white;
font-size:18px;
opacity:0.9;
}

</style>
</head>

<body>

<!-- DOOR -->

<div id="door">

<div class="panel left">
VietVerse
</div>

<div class="panel right">
Khám phá
</div>

<div class="hint">Bấm vào màn hình để khám phá</div>

</div>

<!-- HOME -->

<section id="home" class="active">

<h1>VietVerse</h1>

<p>Khám phá văn hóa Việt Nam theo cách hiện đại dành cho học sinh.</p>

<button onclick="go('menu')">Bắt đầu</button>

</section>

<!-- MENU -->

<section id="menu">

<h1>Bạn muốn làm gì?</h1>

<div class="menu">

<div class="card" onclick="go('exploreMenu')">

<h2>🧭 Khám phá văn hóa</h2>

</div>

<div class="card" onclick="startQuiz()">

<h2>🧠 Quiz văn hóa</h2>

</div>

</div>

</section>

<!-- EXPLORE MENU -->

<section id="exploreMenu">

<h1>Khám phá văn hóa</h1>

<div class="menu">

<div class="card" onclick="showExplore('food')">🍜 Ẩm thực</div>
<div class="card" onclick="showExplore('music')">🎵 Âm nhạc</div>
<div class="card" onclick="showExplore('custom')">🎎 Phong tục</div>
<div class="card" onclick="showExplore('clothes')">👘 Trang phục</div>
<div class="card" onclick="showExplore('art')">🎨 Nghệ thuật</div>

</div>

<button onclick="go('menu')">Quay lại</button>

</section>

<!-- EXPLORE CONTENT -->

<section id="explore">

<h1 id="exploreTitle"></h1>

<p id="exploreText"></p>

<button onclick="go('exploreMenu')">Quay lại</button>

</section>

<!-- QUIZ -->

<section id="quiz">

<h1>Quiz Văn Hóa</h1>

<h2 id="question"></h2>

<div id="answers"></div>

<p id="quizResult"></p>

<div id="quizButtons"></div>

</section>

<script>

/* DOOR */

let opened=false

document.getElementById("door").onclick=function(){

if(opened) return

opened=true

this.classList.add("open")

setTimeout(()=>{

this.style.display="none"

},1500)

}

/* NAV */

function go(target){

document.querySelectorAll("section").forEach(s=>{
s.classList.remove("active")
})

document.getElementById(target).classList.add("active")

}

/* EXPLORE */

function showExplore(type){

go("explore")

const data={

food:{
title:"Ẩm thực Việt Nam",
text:"Ẩm thực Việt nổi tiếng với sự cân bằng hương vị. Các món như phở, bánh mì, bún bò Huế và gỏi cuốn được yêu thích trên toàn thế giới."
},

music:{
title:"Âm nhạc truyền thống",
text:"Âm nhạc Việt có nhiều loại hình như quan họ, ca trù, cải lương. Các nhạc cụ phổ biến gồm đàn bầu, đàn tranh và đàn nguyệt."
},

custom:{
title:"Phong tục tập quán",
text:"Phong tục Việt gắn với gia đình và cộng đồng. Tết Nguyên Đán, Trung Thu và lễ giỗ tổ Hùng Vương là những dịp quan trọng."
},

clothes:{
title:"Trang phục truyền thống",
text:"Áo dài là biểu tượng của sự thanh lịch Việt Nam. Ngoài ra còn có nhiều trang phục dân tộc đa dạng."
},

art:{
title:"Nghệ thuật truyền thống",
text:"Việt Nam có nhiều loại hình nghệ thuật như tranh Đông Hồ, múa rối nước, hát chèo và hát xẩm."
}

}

document.getElementById("exploreTitle").innerText=data[type].title
document.getElementById("exploreText").innerText=data[type].text

}

/* QUIZ */

const quiz=[

{q:"Phở có nguồn gốc từ đâu?",a:["Miền Bắc","Miền Trung","Miền Nam"],c:0},
{q:"Trang phục truyền thống Việt Nam?",a:["Kimono","Áo dài","Hanbok"],c:1},
{q:"Nhạc cụ một dây của Việt Nam?",a:["Đàn bầu","Đàn tranh","Đàn nguyệt"],c:0}

]

let current=0
let score=0

function startQuiz(){

current=0
score=0

go("quiz")

loadQuestion()

}

function loadQuestion(){

const q=quiz[current]

document.getElementById("question").innerText=q.q

const answers=document.getElementById("answers")

answers.innerHTML=""

q.a.forEach((text,i)=>{

const btn=document.createElement("button")

btn.innerText=text

btn.onclick=()=>selectAnswer(i)

answers.appendChild(btn)

})

}

function selectAnswer(i){

if(i===quiz[current].c){

document.getElementById("quizResult").innerText="✅ Đúng!"
score++

}else{

document.getElementById("quizResult").innerText="❌ Sai!"

}

const buttons=document.getElementById("quizButtons")

buttons.innerHTML=""

if(current<quiz.length-1){

const next=document.createElement("button")
next.innerText="Câu hỏi tiếp theo"

next.onclick=()=>{

current++
document.getElementById("quizResult").innerText=""
loadQuestion()
buttons.innerHTML=""

}

buttons.appendChild(next)

}

const back=document.createElement("button")
back.innerText="Quay lại menu"
back.onclick=()=>go("menu")

buttons.appendChild(back)

}

</script>

</body>
</html>
```
